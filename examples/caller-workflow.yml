# Example: merging fragments inside a release job, with a git-cliff fallback
# when there are no fragments (e.g. a release with only chore commits).
name: Promote

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_TOKEN }}

      - name: Merge changelog fragments
        id: merge
        uses: ten-thousand-hammers/changelog-merge@v1
        with:
          fragments-dir: changelog
          output-file: CHANGES_COMBINED.md

      - name: Fallback to git-cliff when there are no fragments
        if: steps.merge.outputs.has-fragments == 'false'
        uses: orhun/git-cliff-action@v4.6.0
        with:
          config: cliff.toml
          args: --unreleased
        env:
          OUTPUT: CHANGES_COMBINED.md

      # ... hand CHANGES_COMBINED.md to changelog-release ...

name: Merge Changelog Fragments
description: Merges per-PR changelog fragments into a single combined changelog, grouping entries under matching category headers.

inputs:
  fragments-dir:
    description: Directory containing changelog fragment files
    default: changelog
  output-file:
    description: Path to write the combined changelog
    default: CHANGES_COMBINED.md
  group-by:
    description: >-
      "pr" nests each PR's categories under its title when there are several
      fragments. "category" lists every PR's entries under shared category
      headers, without PR headings, and drops duplicate entries.
    default: pr

outputs:
  has-fragments:
    description: Whether any fragments were found
    value: ${{ steps.merge.outputs.has-fragments }}

runs:
  using: composite
  steps:
    - name: Merge fragments
      id: merge
      shell: bash
      run: node "$GITHUB_ACTION_PATH/merge.js"
      env:
        FRAGMENTS_DIR: ${{ inputs.fragments-dir }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        GROUP_BY: ${{ inputs.group-by }}
